name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy static site
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Cloudflare credentials
        id: guard
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CF_API_TOKEN" ] || [ -z "$CF_ACCOUNT_ID" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Cloudflare secrets are not configured yet - deploy skipped. Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID under Settings > Secrets and variables > Actions."
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node
        if: steps.guard.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        if: steps.guard.outputs.ready == 'true'
        run: npm ci

      - name: Build static site
        if: steps.guard.outputs.ready == 'true'
        run: npm run build

      # robots.txt is served by functions/robots.txt.ts (host-aware):
      # Allow + Sitemap on fantasticumbrella.com, Disallow on preview hosts.
      # Never overwrite dist/robots.txt here - that would de-index the
      # production domain once the main domain points at this project.

      - name: Verify multilingual build output
        if: steps.guard.outputs.ready == 'true'
        run: |
          for l in es fr de; do
            test -f "dist/$l/index.html" || { echo "::error::missing /$l/ home"; exit 1; }
            test -f "dist/$l/contact/index.html" || { echo "::error::missing /$l/contact/"; exit 1; }
            test -f "dist/$l/products/index.html" || { echo "::error::missing /$l/products/"; exit 1; }
            grep -q "lang=\"$l\"" "dist/$l/index.html" || { echo "::error::wrong html lang on /$l/"; exit 1; }
            grep -q 'hreflang="es"' "dist/$l/index.html" || { echo "::error::missing reciprocal hreflang on /$l/"; exit 1; }
            grep -q 'hreflang="x-default"' "dist/$l/index.html" || { echo "::error::missing x-default on /$l/"; exit 1; }
          done
          urls=$(grep -c '<loc>' dist/sitemap.xml || true)
          test "$urls" -eq 76 || { echo "::error::sitemap has $urls URLs, expected 76"; exit 1; }
          echo "Multilingual build OK: 76 pages, 76 sitemap URLs"

      - name: Sync Pages environment variables
        if: steps.guard.outputs.ready == 'true'
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ENQUIRY_TO: ${{ secrets.ENQUIRY_TO }}
          ENQUIRY_FROM: ${{ secrets.ENQUIRY_FROM }}
        run: python3 scripts/sync-pages-env.py

      - name: Deploy to Cloudflare Pages
        if: steps.guard.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=fantastic-umbrella

      - name: Verify enquiry endpoint is live
        if: steps.guard.outputs.ready == 'true'
        run: |
          for attempt in $(seq 1 15); do
            code=$(curl -s -o enquiry-check.json -w '%{http_code}' --max-time 15 \
              -X POST "https://fantastic-umbrella-e13.pages.dev/api/enquiry" \
              -H 'Content-Type: application/json' \
              -d '{"_form_time":0}') || code="000"
            body=$(cat enquiry-check.json 2>/dev/null || true)
            if printf '%s' "$body" | grep -q '"ok"'; then
              echo "Endpoint live (HTTP $code): $body"
              echo "400 = validation working, 503 = reachable but no delivery channel configured yet."
              exit 0
            fi
            echo "Attempt $attempt: HTTP $code, endpoint not live yet"
            sleep 5
          done
          echo "::error::/api/enquiry never returned JSON - Pages Functions were likely not bundled (404 / 405 / HTML fallback). The enquiry form would lose submissions."
          exit 1

      - name: Verify delivery configuration is bound
        if: steps.guard.outputs.ready == 'true'
        env:
          RESEND_EXPECTED: ${{ secrets.RESEND_API_KEY }}
        run: |
          diag=$(curl -s --retry 8 --retry-delay 5 --retry-all-errors --max-time 15 \
            https://fantastic-umbrella-e13.pages.dev/api/enquiry) || diag='{}'
          echo "Pipeline status: $diag"
          if [ -n "$RESEND_EXPECTED" ]; then
            if ! printf '%s' "$diag" | jq -e '.delivery.email == true' >/dev/null; then
              echo "::error::RESEND_API_KEY exists in GitHub Secrets but the deployed Function cannot see it. Check the Sync Pages environment variables step."
              exit 1
            fi
            echo "::notice::Delivery channel is bound to this deployment (email=true). No test email was sent."
          else
            echo "::notice::No Resend key in GitHub Secrets - endpoint stays in 503 fallback mode."
          fi

      - name: Verify host-aware robots.txt
        if: steps.guard.outputs.ready == 'true'
        run: |
          body=$(curl -s --retry 8 --retry-delay 5 --retry-all-errors --max-time 15 \
            https://fantastic-umbrella-e13.pages.dev/robots.txt)
          echo "Preview robots.txt: $body"
          if ! printf '%s' "$body" | grep -q 'served-by: pages-function'; then
            echo "::error::robots.txt is not served by the host-aware Function (a static file took precedence)."
            exit 1
          fi
          if ! printf '%s' "$body" | grep -q 'Disallow: /'; then
            echo "::error::Preview hostname is not blocked from indexing."
            exit 1
          fi

      - name: Verify localized pages are live
        if: steps.guard.outputs.ready == 'true'
        run: |
          for l in es fr de; do
            ok=0
            for attempt in $(seq 1 12); do
              body=$(curl -s -H 'Cache-Control: no-cache' --max-time 20 \
                "https://fantasticumbrella.com/$l/?cb=$GITHUB_RUN_ID") || body=''
              if printf '%s' "$body" | grep -q "lang=\"$l\"" \
                 && printf '%s' "$body" | grep -q 'hreflang="x-default"'; then
                ok=1; break
              fi
              echo "Attempt $attempt: /$l/ not switched yet"
              sleep 5
            done
            test "$ok" -eq 1 || { echo "::error::/$l/ never returned the localized page"; exit 1; }
            echo "  /$l/ OK"
          done
          sitemap=$(curl -s -H 'Cache-Control: no-cache' --max-time 20 \
            https://fantasticumbrella.com/sitemap.xml)
          count=$(printf '%s' "$sitemap" | grep -c '<loc>' || true)
          test "$count" -eq 76 || { echo "::error::live sitemap has $count URLs, expected 76"; exit 1; }
          echo "Live multilingual sitemap OK: $count URLs"
