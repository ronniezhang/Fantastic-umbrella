name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy static site
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Cloudflare credentials
        id: guard
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CF_API_TOKEN" ] || [ -z "$CF_ACCOUNT_ID" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Cloudflare secrets are not configured yet - deploy skipped. Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID under Settings > Secrets and variables > Actions."
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node
        if: steps.guard.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        if: steps.guard.outputs.ready == 'true'
        run: npm ci

      - name: Build static site
        if: steps.guard.outputs.ready == 'true'
        run: npm run build

      - name: Block indexing on preview domain
        if: steps.guard.outputs.ready == 'true'
        run: |
          printf 'User-agent: *\nDisallow: /\n' > dist/robots.txt

      - name: Deploy to Cloudflare Pages
        if: steps.guard.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=fantastic-umbrella

      - name: Verify enquiry endpoint is live
        if: steps.guard.outputs.ready == 'true'
        run: |
          code=$(curl --retry 8 --retry-delay 5 --retry-all-errors -s -o enquiry-check.json -w '%{http_code}' \
            -X POST "https://fantastic-umbrella-e13.pages.dev/api/enquiry" \
            -H 'Content-Type: application/json' \
            -d '{"_form_time":0}') || code="000"
          echo "HTTP $code"
          cat enquiry-check.json || true
          if [ "$code" = "404" ]; then
            echo "::error::/api/enquiry returned 404 - Pages Functions were not bundled. The enquiry form cannot receive submissions."
            exit 1
          fi
          if [ "$code" = "000" ]; then
            echo "::warning::Could not reach the preview domain to verify the endpoint. Check /api/enquiry manually."
          else
            echo "::notice::Endpoint reachable. 400 = validation working, 503 = reachable but no delivery channel configured yet."
          fi
